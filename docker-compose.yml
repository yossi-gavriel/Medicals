# ──────────────────────────────────────────────────────────────
# Local / staging deployment of the full async pipeline:
#   api      → FastAPI service (sync interaction checks + async classify ingress)
#   worker   → Arq worker pulling jobs from Redis, calling the LLM, writing rows
#   outbox   → Worker process that publishes webhook events
#   postgres → durable storage
#   redis    → cache + job queue (separate logical DBs)
# ──────────────────────────────────────────────────────────────
name: drug-safety-engine

x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  image: drug-safety-engine:local
  env_file:
    - .env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  volumes:
    - document_storage:/app/local_storage/documents

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: drug_safety
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d drug_safety"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *app-base
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app-base
    command:
      - "uvicorn"
      - "app.main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--proxy-headers"
      - "--forwarded-allow-ips=*"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app-base
    command: ["arq", "app.workers.classification_worker.WorkerSettings"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  outbox:
    <<: *app-base
    command: ["python", "-m", "app.workers.outbox_publisher"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  document_storage:
